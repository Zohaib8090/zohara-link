name: Build Zohara Link Android app

# Builds an installable APK of the phone app and keeps it as the run's artifact (30 days). Nothing is published anywhere:
# you download the APK from the run page and install it on the phone (see docs/ANDROID.md).
# It is a DEBUG build signed with a throwaway debug key made fresh on every run, so Android treats each build as a
# different signer: uninstall the old app before installing a newer one (pairing is kept on the computer, the phone must pair again).

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # The project's debug signing config points at ./debug.keystore, which is (rightly) not in git.
      - name: Make a debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build the debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/zohara-link-${GITHUB_SHA::7}-debug.apk"
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zohara-link-android-apk
          path: out/*.apk
          retention-days: 30
