name: Build & Publish Zohara Link Daemon

# Builds the Linux daemon with makepkg and uploads the package as the run's artifact. It does NOT publish:
# publish-alpha.yml sends every finished build on main to the ALPHA channel (the development channel), and beta and
# stable are chosen on purpose from the release admin site. Until 2026-10-08 a push to main published to stable by
# itself. Only the Linux daemon is packaged here; Android changes do not trigger it.

on:
  push:
    branches: [main, beta]
    paths:
      - 'linux-daemon/**'
      - '.github/workflows/build-linkd.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PACKAGES_REPO: Zohaib8090/zohara-packages
  PKG: zohara-linkd

jobs:
  build:
    name: Build + package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git rust sudo github-cli
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Test the daemon
        run: |
          chown -R builder:builder .
          cd linux-daemon
          sudo -u builder cargo test --locked

      - name: Compute version
        id: version
        run: |
          VER=$(grep '^version' linux-daemon/Cargo.toml | head -1 | cut -d'"' -f2)
          [ -n "$VER" ] || { echo "::error::Could not read version from Cargo.toml"; exit 1; }
          # Cargo version + build time: always newer than the last build, so pacman sees an update.
          VER="$VER.$(date -u +%Y%m%d%H%M)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # The PKGBUILD's build() runs `cargo build --release --locked`, so
      # makepkg is also the compile check.
      - name: Run makepkg
        run: |
          chown -R builder:builder .
          cd linux-daemon
          sudo -u builder env _PKGVER="${{ steps.version.outputs.version }}" makepkg --nocheck --skippgpcheck
          PKG_FILE=$(ls *.pkg.tar.zst | head -1)
          echo "package_file=$PKG_FILE" >> "$GITHUB_ENV"
          echo "package_path=linux-daemon/$PKG_FILE" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zohara-linkd-arch-x86_64
          path: ${{ env.package_path }}
